# ~/.tmux.conf — Gino Clement

# --- Prefix: Ctrl-Space ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- General ---
set -g mouse on                       # click panes/windows, wheel scroll, drag to resize
set -g base-index 1                   # windows start at 1
setw -g pane-base-index 1             # panes start at 1
set -g renumber-windows on            # close a window, the rest renumber
set -g history-limit 50000
set -s escape-time 0                  # no delay after Esc (matters in nvim)
set -g focus-events on
setw -g aggressive-resize on

# --- True color ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# --- Splits & windows keep the current path ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Pane navigation: Alt+arrows, no prefix needed ---
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- Window navigation: Shift+arrows, no prefix needed ---
bind -n S-Left  previous-window
bind -n S-Right next-window

# --- Popups: lazygit / lazydocker in the current directory ---
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"
bind D display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazydocker"

# --- Reload config: prefix r ---
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- Status bar ---
set -g status-position bottom
set -g status-style "bg=colour234,fg=colour250"
set -g status-left "#[fg=colour39,bold] #S #[default] "
set -g status-left-length 20
set -g status-right "#[fg=colour245]%Y-%m-%d %H:%M "
setw -g window-status-current-style "fg=colour39,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-active-border-style "fg=colour39"

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # prefix + Ctrl-s save, prefix + Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'    # auto-save + restore sessions across reboots
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Auto-install TPM on first launch
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
