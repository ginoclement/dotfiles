# ~/.config/kitty/kitty.conf — Gino Clement
# Colors match gino-dark (rofi/starship/tmux): dark gray + cyan accent

# --- Font (pacman: ttf-jetbrains-mono-nerd) ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.0

# --- Behavior ---
scrollback_lines 50000
enable_audio_bell no
confirm_os_window_close 0
strip_trailing_spaces smart
mouse_hide_wait 2.0

# --- Look ---
window_padding_width 6
background_opacity 0.97
cursor_shape block
url_color #4fd6c9
url_style curly

# --- Tabs (mostly living in tmux, but for when you don't) ---
tab_bar_style powerline
tab_powerline_style slanted
active_tab_background   #4fd6c9
active_tab_foreground   #1a1b1e
inactive_tab_background #26282c
inactive_tab_foreground #6f7178

# --- gino-dark palette ---
background #1a1b1e
foreground #d8d8d8
cursor     #4fd6c9
selection_background #4fd6c9
selection_foreground #1a1b1e

# black
color0  #26282c
color8  #3a3d42
# red
color1  #d75f87
color9  #e78ba8
# green
color2  #87d787
color10 #a3e6a3
# yellow
color3  #e5c07b
color11 #f0d399
# blue
color4  #61afef
color12 #85c2f5
# magenta
color5  #c678dd
color13 #d79ae8
# cyan
color6  #4fd6c9
color14 #7ce3d9
# white
color7  #d8d8d8
color15 #ffffff

# --- Keybindings ---
# New tabs/windows keep the current directory
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
# Font size
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
