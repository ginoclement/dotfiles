-- ~/.config/conky/conky.conf — Gino Clement
-- Live system stats on the desktop, gino-dark colors.
-- Note: pins to the desktop reliably on X11; on a KDE Wayland session
-- positioning/layering can be flaky (see README).
--
-- NETWORK: replace wlp3s0 below with your interface name (`ip link` lists
-- them; wlp* = wifi, enp* = ethernet).
--
-- MUSIC: needs playerctl (installed by install.sh). Album art is cached by
-- nowplaying.sh; the ${image ... -p 16,640} y-coordinate is absolute from
-- the window top, so nudge 640 up/down if the art doesn't sit next to the
-- track text (e.g. no battery section on a desktop → try ~560).

conky.config = {
    alignment = 'top_right',
    gap_x = 40,
    gap_y = 60,
    minimum_width = 280,
    maximum_width = 280,

    update_interval = 2,
    double_buffer = true,
    no_buffers = true,
    cpu_avg_samples = 2,
    net_avg_samples = 2,

    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=10',
    override_utf8_locale = true,

    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 140,
    own_window_colour = '1a1b1e',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    border_inner_margin = 16,

    default_color = 'd8d8d8',
    color1 = '4fd6c9',  -- accent (cyan)
    color2 = '6f7178',  -- dim
    color3 = 'd75f87',  -- warning
}

conky.text = [[
${color1}${font JetBrainsMono Nerd Font:size=30}${time %H:%M}${font}
${color2}${time %A, %d %B %Y}${color}
${color2}up ${uptime_short}  ·  ${nodename}${color}

${color1}CPU ${hr 1}${color}
${cpu cpu0}% ${cpubar cpu0 6}
${color2}${top name 1}${alignr}${top cpu 1}%
${top name 2}${alignr}${top cpu 2}%
${top name 3}${alignr}${top cpu 3}%${color}

${color1}MEMORY ${hr 1}${color}
${mem} / ${memmax} ${alignr}${memperc}%
${membar 6}

${color1}DISK ${hr 1}${color}
/ ${alignr}${fs_used /} / ${fs_size /}
${fs_bar 6 /}

${color1}NETWORK ${hr 1}${color}
${color2}ip ${alignr}${execi 60 ip -4 route get 1.1.1.1 2>/dev/null | awk '{print $7; exit}'}${color}
wlp3s0 ${alignr}▼ ${downspeed wlp3s0}  ▲ ${upspeed wlp3s0}

${color1}DOCKER ${hr 1}${color}
running containers ${alignr}${execi 30 docker ps -q 2>/dev/null | wc -l}
${if_existing /sys/class/power_supply/BAT0}\

${color1}BATTERY ${hr 1}${color}
${battery_percent BAT0}% ${alignr}${battery_status BAT0}
${battery_bar 6 BAT0}${endif}

${color1}MUSIC ${hr 1}${color}
${texeci 5 ~/.config/conky/nowplaying.sh art}\
${image ~/.cache/conky/albumart.png -p 16,640 -s 84x84 -n}\
${goto 115}${color1}${texeci 5 ~/.config/conky/nowplaying.sh status} ${texeci 5 ~/.config/conky/nowplaying.sh title}${color}
${goto 115}${texeci 5 ~/.config/conky/nowplaying.sh artist}
${goto 115}${color2}${texeci 5 ~/.config/conky/nowplaying.sh album}${color}
${voffset 20}
]]
